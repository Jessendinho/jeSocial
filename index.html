<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b2c">
  <meta name="description" content="The world, in your conversation.">
  <meta name="application-name" content="jeSocial">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="jeSocial">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <meta http-equiv="refresh" content="0; url=./jesocial-prototype.html">
  <title>jeSocial — The world, in your conversation</title>
  <style>
    :root{--green:#123b2c;--gold:#e8b84b;--cream:#f4f2ea}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--green);color:white;font-family:Inter,system-ui,sans-serif}
    #jes-launch-screen{position:fixed;inset:0;z-index:99999;background:#123b2c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .45s ease}
    #jes-launch-screen.jes-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .jes-icon-wrap{width:118px;height:118px;border-radius:26px;background:#f4f2ea;display:grid;place-items:center;box-shadow:0 12px 32px #00000033, 0 0 0 2px #e8b84b33;overflow:hidden}
    .jes-icon-wrap img{width:100%;height:100%;object-fit:cover}
    .jes-app-name{margin-top:20px;font-size:28px;font-weight:900;color:#fffefa}.jes-app-name span{color:#e8b84b}
    .jes-tagline{margin-top:10px;font-size:13px;color:#ffffffc8;text-align:center}
    .jes-accent-line{margin-top:22px;width:42px;height:3px;border-radius:99px;background:linear-gradient(90deg,#e8b84b,#f6d27a)}
  </style>
</head>
<body>
  <div id="jes-launch-screen">
    <div class="jes-icon-wrap"><img src="./icons/icon-512.png" alt="jeSocial icon"></div>
    <div class="jes-app-name">je<span>Social</span></div>
    <div class="jes-tagline">The world, in your conversation.</div>
    <div class="jes-accent-line"></div>
  </div>
  <p style="position:absolute;bottom:24px;color:#ffffff66;font-size:12px">Opening jeSocial…</p>
  <script>
    // Preserve original redirect behavior while enabling PWA
    window.location.replace("./jesocial-prototype.html");
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function(){});
    }
  </script>
</body>
</html>
